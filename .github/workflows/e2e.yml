name: ReleaseGuard E2E Critical-Flow Regression

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  regression-gate:
    name: Playwright Critical-Flow Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout ReleaseGuard Mini
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout Target Application (Pinned Reference)
        uses: actions/checkout@v4
        with:
          repository: 'cypress-io/cypress-realworld-app'
          ref: '79aa5b126fdd951aab2263c8201b52aeb5f2a43c'
          path: 'target-app'

      - name: Install Target App Dependencies & Setup Mocks
        working-directory: ./target-app
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          sudo corepack enable || true
          yarn install --frozen-lockfile
          cp scripts/mock-aws-exports.js src/aws-exports.js
          cp scripts/mock-aws-exports-es5.js aws-exports-es5.js

      - name: Install ReleaseGuard Dependencies
        run: npm ci

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install chromium --with-deps

      - name: Start Target App & Execute Critical-Flow Gate
        run: |
          cd target-app
          yarn start &
          cd ..
          echo "Waiting for services on port 3000 and 3001..."
          for i in {1..60}; do
            if curl -s http://localhost:3000 >/dev/null && curl -s http://localhost:3001 >/dev/null; then
              echo "Both services are ready!"
              break
            fi
            sleep 2
          done
          if ! curl -s http://localhost:3000 >/dev/null || ! curl -s http://localhost:3001 >/dev/null; then
            echo "Error: Services failed to start within 120 seconds."
            exit 1
          fi
          npx playwright test

      - name: Upload Playwright Test Report & Failure Traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
