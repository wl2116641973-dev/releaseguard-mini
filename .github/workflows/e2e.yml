name: ReleaseGuard E2E Critical-Flow Regression

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  regression-gate:
    name: Playwright Critical-Flow Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout ReleaseGuard Mini
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Checkout Target Application (Pinned Reference)
        uses: actions/checkout@v4
        with:
          repository: 'cypress-io/cypress-realworld-app'
          ref: '79aa5b126fdd951aab2263c8201b52aeb5f2a43c'
          path: 'target-app'

      - name: Install Target App Dependencies & Setup Mocks
        working-directory: ./target-app
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          corepack enable
          corepack yarn install --frozen-lockfile
          corepack yarn copy:mock:awsexports || cp scripts/mock-aws-exports.js src/aws-exports.js
          corepack yarn copy:mock:awsexportses5 || cp scripts/mock-aws-exports-es5.js aws-exports-es5.js

      - name: Install ReleaseGuard Dependencies
        run: npm ci

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install chromium --with-deps

      - name: Start Target App & Execute Critical-Flow Gate
        run: |
          cd target-app && corepack yarn start &
          cd ..
          npx wait-on -t 120000 http://localhost:3000 http://localhost:3001
          npx playwright test

      - name: Upload Playwright Test Report & Failure Traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
